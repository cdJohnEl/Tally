    <path d="M256 160 L256 200" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    <path d="M256 288 L256 328" stroke="#ec4899" stroke-width="12" stroke-linecap="round" />
    <path d="M192 244 L216 244" stroke="#818cf8" stroke-width="12" stroke-linecap="round" />
